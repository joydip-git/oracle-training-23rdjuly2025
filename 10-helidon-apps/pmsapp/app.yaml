kind: Service
apiVersion: v1
metadata:
  name: pmsapp
  labels:
    app: pmsapp
spec:
  type: ClusterIP
  selector:
    app: pmsapp
  ports:
    - name: tcp
      port: 8080
      protocol: TCP
      targetPort: 8080
---
kind: Deployment
apiVersion: apps/v1
metadata:
  name: pmsapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pmsapp
  template:
    metadata:
      labels:
        app: pmsapp
        version: v1
    spec:
      containers:
      - name: pmsapp
        image: pmsapp
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
