apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-message-app
spec:
  selector:
    matchLabels:
      app: kube-message-pod
  replicas: 1
  template:
    metadata:
      labels:
        app: kube-message-pod
        # podname: kub-pod
    spec:
      containers:
        - name: kube-message-container
          image: joydipdocker/kub-app:v1
          resources:
            limits:
              memory: "128Mi"
              cpu: "500m"
